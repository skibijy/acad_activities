<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-fluid py-3 text-center magic position-fixed top-0 z-1 shadow">
        <div class="h3 mb-0">Wizarding Archive</div>
        <div class="magic-subtitle">Characters of the Wizarding World</div>
    </div>

    <section class="hero-section">
    </section>

    <section class="search-section">

        <div class="container text-center py-4">

            <div class="search-container">

                <div class="d-flex flex-row">
                    <input type="text" class="form-control rounded-start-pill"
                        placeholder="Search by name, house or actor" id="searchInput">

                    <button class="btn btn-warning rounded-end-pill px-4 me-2" onclick="searchCharacter()">
                        Search
                    </button>

                    <button class="btn btn-secondary rounded-pill px-4" onclick="clearSearch()">
                        Clear
                    </button>

                </div>

            </div>

        </div>

    </section>

    <div class="container mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination">

                <li class="page-item">
                    <button class="page-link" onclick="prev()">
                        < Back </button>
                </li>

                <li class="page-item active">
                    <span class="page-link" id="currentpage">1</span>
                </li>

                <li class="page-item">
                    <button class="page-link" onclick="next()">
                        Next >
                    </button>
                </li>
            </ul>
        </nav>
    </div>

    <div class="container mb-5">
        <div class="row g-4" id="parent">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        var elParent = document.getElementById("parent");
        var elCurrentPage = document.getElementById("currentpage");
        var inSearchInput = document.getElementById("searchInput");

        const urlParams = new URLSearchParams(window.location.search);

        var page = parseInt(urlParams.get("page")) || 1;
        var value = urlParams.get("value") || "";

        var perPage = 6;
        var finalPage = 1;

        var characters = [];

        inSearchInput.value = value;

        const getCharacters = async () => {

            elParent.innerHTML = "";
            elCurrentPage.innerHTML = page;

            try {

                const response = await fetch('https://potterapi-fedeperin.vercel.app/en/characters');

                if (!response.ok) {
                    throw new Error("Unable to fetch characters");
                }

                var allCharacters = await response.json();

                characters = allCharacters.filter(function (character) {
                    return (
                        (character.fullName || "").toLowerCase().includes(value.toLowerCase()) ||
                        (character.hogwartsHouse || "").toLowerCase().includes(value.toLowerCase()) ||
                        (character.interpretedBy || "").toLowerCase().includes(value.toLowerCase())
                    );
                });

                finalPage = Math.ceil(characters.length / perPage);

                if (finalPage === 0) {
                    finalPage = 1;
                }

                if (page > finalPage) {
                    page = finalPage;
                }

                elCurrentPage.innerHTML = page;

                var start = (page - 1) * perPage;
                var end = start + perPage;

                var displayedCharacters = characters.slice(start, end);

                if (displayedCharacters.length === 0) {
                    elParent.innerHTML =
                        '<p class="text-white text-center">No characters found.</p>';
                    return;
                }

                displayedCharacters.forEach(function (character) {

                    var card = document.createElement("div");
                    card.className = "col-12 col-md-6 col-lg-4";

                    var image = character.image || "";
                    var name = character.fullName || "Unknown";
                    var house = character.hogwartsHouse || "Unknown House";
                    var actor = character.interpretedBy || "Unknown Actor";

                    card.innerHTML = `
                <div class="card h-100 rounded-4 shadow p-3
                            bg-dark bg-opacity-75 text-white">

                    <img src="${image}"
                         class="card-img-top rounded-3"
                         style="height: 200px; object-fit: contain;"
                         alt="Harry Potter character">

                    <div class="card-body text-center">
                        <h5 class="card-title"></h5>
                        <p class="card-text small"></p>
                    </div>

                    <a href="view.html?index=${character.index}&page=${page}&value=${encodeURIComponent(value)}"
                        class="stretched-link"></a>
                   </div>
            `;
                    var cardEl = card.querySelector(".card");
                    cardEl.classList.add("magic-card");
                    cardEl.dataset.house = house;

                    card.querySelector(".card-title").textContent = name;

                    card.querySelector(".card-text").textContent =
                        "House: " + house + " | Actor: " + actor;

                    elParent.appendChild(card);
                });

            } catch (error) {

                console.log(error);

                elParent.innerHTML =
                    '<p class="text-white text-center">Error loading characters.</p>';
            }
        };

        function updatePage() {

            const params = new URLSearchParams();

            if (value) {
                params.set("value", value);
            }

            params.set("page", page);

            window.history.pushState({}, "", "?" + params.toString());

            getCharacters();
        }

        function searchCharacter() {

            value = inSearchInput.value.trim();
            page = 1;

            updatePage();
        }

        function prev() {

            if (page > 1) {
                page -= 1;
                updatePage();
            }
        }

        function next() {

            if (page < finalPage) {
                page += 1;
                updatePage();
            }
        }

        function clearSearch() {
            inSearchInput.value = "";
            value = "";
            page = 1;
            updatePage();
        }

        getCharacters();
    </script>

    <footer class="bg-dark bg-opacity-75 text-white text-center py-3 mt-auto">
        &copy; 2026 Wizarding Archive. All rights reserved.
    </footer>
</body>

</html>
