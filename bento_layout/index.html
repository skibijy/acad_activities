<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bento_layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500&display=swap"
        rel="stylesheet">
</head>

<body style="background-color: #000000; font-family: 'DM Sans', sans-serif;">
    <div class="container-fluid mt-3 pb-3">
        <div class="row g-3">

            <div class="col-md-3">
                <div class="p-3 border-0 rounded-4 mb-3"
                    style="min-height: 450px; text-align: center; background-color: #e85a8a; color: #4a1023;">
                    <p class="fs-3" style="font-family: 'Playfair Display', serif;"><b>Today</b></p>
                    <img src="img/img.jpg" alt="Fruit platter" class="w-100 rounded-4"
                        style="height: 260px; object-fit: cover;">
                    <p class="mt-3">Three meals planned</p>
                </div>
                <div class="p-3 border-0 rounded-4"
                    style="min-height: 175px; background-color: #f8d7e2; color: #4a1023;">
                    <p>meals planned stat</p>
                </div>
            </div>

            <div class="col-md-6">

                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <div class="p-3 border-0 rounded-4"
                            style="min-height: 175px; text-align: center; background-color: #7a1d3d; color: #ffffff;">
                            <h1>Weekly Meal Plan</h1>
                            <p>Three meals per day : Groceries Budget 1,000 </p>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-4">
                        <div class="p-3 border-0 rounded-4"
                            style="min-height: 259px; background-color: #fdf2f5; color: #4a1023;">
                            <p class="fs-5"><b><img src="img/sun.png" alt="Sun icon" class="me-2 align-middle"
                                        style="width: 28px;">Breakfast</b></p>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="p-3 border-0 rounded-4"
                            style="min-height: 259px; background-color: #e85a8a; color: #4a1023;">
                            <p class="fs-5"><b><img src="img/restaurant.png" alt="Cloud icon" class="me-2 align-middle"
                                        style="width: 28px;">Lunch</b></p>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="p-3 border-0 rounded-4"
                            style="min-height: 259px; background-color: #f8d7e2; color: #4a1023;">
                            <p>dinner</p>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12">
                        <div class="p-3 border-0 rounded-4"
                            style="min-height: 175px; background-color: #7a1d3d; color: #ffffff;">
                            <p>this week</p>
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-md-3">
                <div class="p-3 border-0 rounded-4 mb-3"
                    style="min-height: 450px; background-color: #fdf2f5; color: #4a1023;">
                    <p>grocery list</p>
                </div>
                <div class="p-3 border-0 rounded-4"
                    style="min-height: 175px; background-color: #e85a8a; color: #4a1023;">
                    <p>budget</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
