<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Gallery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body style="background-color: #ece3f9; color: #2d2142;">

  <h1 class="text-center mt-4">Pet Gallery</h1>
  <p class="text-center mb-0">
    Meet the pets and see their adorableness.
  </p>

  <div class="container mt-4 pb-4">

    <div class="row g-3" id="pets">
      <!-- Pet cards -->
    </div>

    <div class="row justify-content-center mt-4">
      <div class="col-md-6">
        <div class="card text-center shadow rounded-4 border-0">
          <div class="card-body" id="summary">
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>

  <script>

    var pets = [
      {
        name: "Chochi",
        kind: "Dog",
        image: "img/chochi.jpg",
        description: "Always ready for a walk and happy to greet everyone at the door.",
        traits: ["Friendly", "Energetic", "Loyal"],
      },
      {
        name: "Mochi",
        kind: "Cat",
        image: "img/mochy.jpg",
        description: "Watches the room from the window and decides when it is time to play.",
        traits: ["Playful", "Curious"],
      },
      {
        name: "Roro",
        kind: "Dog",
        image: "img/roro.jpg",
        description: "A calm companion who loves long naps and slow afternoons.",
        traits: ["Loving", "Gentle", "Loyal"],
      },
      {
        name: "Vanilla",
        kind: "Cat",
        image: "img/vanilla.jpg",
        description: "Sleeps in the sunniest spot of the house and purrs at the smallest pat.",
        traits: ["Sleepy", "Sweet"],
      },
    ];

    var elPets = document.getElementById("pets");

    for (var i = 0; i < pets.length; i++) {

      var traitsHtml = "";

      for (var j = 0; j < pets[i].traits.length; j++) {
        traitsHtml +=
          `<span class="badge rounded-pill me-1 mb-1"
          style="background-color: #ffe3c2; color: #6b3b00;">`
          + pets[i].traits[j] +
          `</span>`;
      }

      elPets.innerHTML +=
        `<div class="col-md-6">
          <div class="card h-100 text-center shadow rounded-4 border-0">
            <div class="card-body">

              <img src="` + pets[i].image + `" 
                alt="` + pets[i].kind + `"
                class="w-100 mb-3 rounded-3"
                style="height: 220px; object-fit: cover;">

              <h2 class="h4 card-title">`
        + pets[i].name +
        `</h2>

              <p class="text-body-secondary small mb-2">`
        + pets[i].kind +
        `</p>

              <p class="card-text">`
        + pets[i].description +
        `</p>

              <div>`
        + traitsHtml +
        `</div>

            </div>
          </div>
        </div>`;
    }

    document.getElementById("summary").innerHTML =
      `<b>` + pets.length + `</b> Soon...`;

  </script>
</body>

</html>
