<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background-image: url("img/disney.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
    </style>

</head>

<body>
    <div class="container-fluid p-2 bg-dark">
        <div class="row">
            <div class="col">
                <div class="h3 text-white mb-0">
                    Disney Characters
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-3">
        <div class="row">
            <div class="col">
                <div class="card rounded-5 p-3 text-center bg-dark bg-opacity-75 text-white">
                    <div class="d-flex flex-row">
                        <input type="text" class="form-control rounded-start-pill" placeholder="Enter Character Name"
                            id="searchInput">
                        <div class="btn btn-primary rounded-end-pill" onclick="searchCharacter()">Search</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col">
                <div class="card rounded-5 p-4 text-center bg-dark bg-opacity-75 text-white">
                    <div id="imageContainer" class="mx-auto">
                        <img src="" id="image" class="img-fluid rounded-4" style="max-height: 250px;">
                    </div>
                    <h3 class="my-3" id="name">
                        Search for a Disney Character
                    </h3>
                    <p id="films"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        var elName = document.getElementById("name");
        var elImage = document.getElementById("image");
        var elFilms = document.getElementById("films");
        var inSearchInput = document.getElementById("searchInput");

        const searchCharacter = async () => {

            var characterName = inSearchInput.value.trim();

            if (characterName === "") {
                elName.innerHTML = "Please enter a character name";
                elImage.src = "";
                elFilms.innerHTML = "";
                return;
            }

            elName.innerHTML = "Loading " + characterName;
            elImage.src = "";
            elFilms.innerHTML = "";

            try {
                const response = await fetch(
                    'https://api.disneyapi.dev/character?name='
                    + encodeURIComponent(characterName)
                );

                if (!response.ok) {
                    throw new Error("Character not found");
                }

                const result = await response.json();

                const character = Array.isArray(result.data)
                    ? result.data[0]
                    : result.data;

                if (!character) {
                    elName.innerHTML = "Character not found";
                    return;
                }

                elName.textContent = character.name;
                elImage.src = character.imageUrl || "";
                elFilms.textContent = "Films: " +
                    (character.films || []).join(", ");

            } catch (error) {
                elName.innerHTML = "Unable to find character";
                elImage.src = "";
                elFilms.innerHTML = "";
            }
        };
    </script>
</body>

</html>
